server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name oj.clue.edu.vn;

    # Docker embedded DNS: re-resolve upstream IPs so recreating site/wsevent
    # containers (new IPs) never leaves nginx pointing at a stale address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $site_upstream site:8000;
    set $wsevent_event_upstream wsevent:15100;
    set $wsevent_channels_upstream wsevent:15102;

    error_log /var/log/nginx/error.log;
    client_max_body_size 1000M;

    add_header X-UA-Compatible "IE=Edge,chrome=1";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;
    try_files $uri @icons;
    error_page 502 504 /502.html;

    location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
        root /assets/;
    }

    location @icons {
        root /assets/resources/icons/;
        log_not_found off;
        error_page 403 = @uwsgi;
        error_page 404 = @uwsgi;
    }

    location @uwsgi {
        uwsgi_read_timeout 600;
        uwsgi_pass $site_upstream;
        include uwsgi_params;
        uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
    }

    location /static {
        gzip_static on;
        expires max;
        root /assets/;
    }

    location /martor {
        root /media/;
    }

    location /pdf {
        root /media/;
    }

    location /submission_file {
        root /media/;
    }

    location /userdatacache {
        internal;
        root /;
    }

    location /contestdatacache {
        internal;
        root /;
    }

    location /event/ {
        rewrite ^/event/(.*)$ /$1 break;
        proxy_pass http://$wsevent_event_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /channels/ {
        proxy_read_timeout          120;
        proxy_pass http://$wsevent_channels_upstream;
    }
}
