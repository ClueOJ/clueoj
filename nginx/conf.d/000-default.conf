# Default 443: ClueOJ test qua IP (chứng chỉ self-signed, IP SAN). Tadscore/tadquiz/grist vẫn chỉ qua domain riêng.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/conf.d/certs/ip-default/fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/ip-default/privkey.pem;

    # Docker embedded DNS: re-resolve upstream IPs so recreating site/wsevent
    # containers (new IPs) never leaves nginx pointing at a stale address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $site_upstream site:8000;
    set $wsevent_event_upstream wsevent:15100;
    set $wsevent_channels_upstream wsevent:15102;

    client_max_body_size 1000M;
    location /static { gzip_static on; expires max; root /assets/; }
    location /martor { root /media/; }
    location /pdf { root /media/; }
    location /submission_file { root /media/; }
    location /event/ { rewrite ^/event/(.*)$ /$1 break; proxy_pass http://$wsevent_event_upstream; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 86400; }
    location /channels/ { proxy_read_timeout 120; proxy_pass http://$wsevent_channels_upstream; }
    location @uwsgi { uwsgi_read_timeout 600; uwsgi_pass $site_upstream; include uwsgi_params; }
    location / { uwsgi_read_timeout 600; uwsgi_pass $site_upstream; include uwsgi_params; }
}
